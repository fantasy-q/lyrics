name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blowfish theme (pinned commit)
        # 与本地 themes/blowfish 完全同一提交，避免 CI 与本地漂移
        run: |
          git clone https://github.com/nunocoracao/blowfish.git themes/blowfish
          git -C themes/blowfish checkout 7ab6a75d42e0131f51a28fd361656e7a89e0a8d6

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        # GitHub 没有官方 setup-hugo；peaceiris/actions-hugo 是 Hugo 官方文档推荐的方案
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Build
        # baseURL 由 configure-pages 提供（项目站点会自动带上 /lyrics/ 子路径）
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
