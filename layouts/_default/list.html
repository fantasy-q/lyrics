{{ define "main" }}
<h1>{{ .Title }}</h1>
<ul class="song-list">
  {{ range .Pages }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Params.romaji }}<span class="romaji">({{ . }})</span>{{ end }}
    {{ with .Params.artist }}— <span class="artist">{{ . }}</span>{{ end }}
  </li>
  {{ end }}
</ul>
{{ .Content }}
{{ end }}
