{{/* Blowfish 扩展钩子：全站注入脚本（复制歌词按钮 + 罗马字注音开关） */}}
<script>
(function () {
  /* ---- 复制歌词（按钮由 lyrics shortcode 生成） ---- */
  var payload = null;
  var node = document.getElementById('copy-data');
  if (node) {
    try { payload = JSON.parse(node.textContent); } catch (e) { payload = null; }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  function showFeedback(btn) {
    var old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(function () { btn.textContent = old; }, 1200);
  }
  var btns = document.querySelectorAll('.copy-btn');
  Array.prototype.forEach.call(btns, function (btn) {
    btn.addEventListener('click', function () {
      var mode = btn.getAttribute('data-mode');
      var text = (payload && payload[mode]) || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { showFeedback(btn); },
          function () { fallbackCopy(text); showFeedback(btn); }
        );
      } else {
        fallbackCopy(text);
        showFeedback(btn);
      }
    });
  });

  /* ---- 罗马字注音开关（localStorage 记忆，默认开） ---- */
  var romajiBtn = document.querySelector('.romaji-toggle');
  var lyricsBox = document.querySelector('.lyrics');
  if (romajiBtn && lyricsBox) {
    var KEY = 'lyrics-romaji-on';
    var on = localStorage.getItem(KEY) !== 'off';
    function applyRomaji() {
      lyricsBox.classList.toggle('no-romaji', !on);
      romajiBtn.textContent = on ? '罗马字：开' : '罗马字：关';
      romajiBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    applyRomaji();
    romajiBtn.addEventListener('click', function () {
      on = !on;
      localStorage.setItem(KEY, on ? 'on' : 'off');
      applyRomaji();
    });
  }
})();
</script>
