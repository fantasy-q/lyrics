{{/* Blowfish 扩展钩子：所有页面底部注入复制歌词按钮的脚本（按钮由 lyrics shortcode 生成） */}}
<script>
(function () {
  var payload = null;
  var node = document.getElementById('copy-data');
  if (node) {
    try { payload = JSON.parse(node.textContent); } catch (e) { payload = null; }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  function showFeedback(btn) {
    var old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(function () { btn.textContent = old; }, 1200);
  }
  var btns = document.querySelectorAll('.copy-btn');
  Array.prototype.forEach.call(btns, function (btn) {
    btn.addEventListener('click', function () {
      var mode = btn.getAttribute('data-mode');
      var text = (payload && payload[mode]) || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { showFeedback(btn); },
          function () { fallbackCopy(text); showFeedback(btn); }
        );
      } else {
        fallbackCopy(text);
        showFeedback(btn);
      }
    });
  });
})();
</script>
